# Founder THR-346 seq43/44 approves this ONE manual Linux build workflow.
# THR-291: packaging is not a required PR/merge check; manual dispatch only.
# Build and installed-.deb smoke share the existing native two-architecture job.
name: Build Linux App Payload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux payload (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv and build-host Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Set up native Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache: false
      - name: Build committed Linux payload
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$EXPECTED_ARCH"
          bash packaging/linux/build-payload.sh
      - name: Build Debian desktop package
        run: |
          set -euo pipefail
          payloads=(dist/linux/*.tar.gz)
          test "${#payloads[@]}" -eq 1
          bash packaging/linux/build-deb.sh "${payloads[0]}"
      - name: Smoke installed Debian desktop package
        run: |
          set -euo pipefail
          packages=(dist/linux/*.deb)
          test "${#packages[@]}" -eq 1
          bash packaging/linux/smoke-installed-deb.sh "${packages[0]}" "$RUNNER_TEMP/installed-deb-evidence"
      - name: Upload installed package smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: happyranch-installed-deb-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/installed-deb-evidence/
      - name: Upload package, intermediate payload and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: happyranch-linux-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            dist/linux/*.deb
            dist/linux/*.tar.gz
            dist/linux/*.tar.gz.sha256
