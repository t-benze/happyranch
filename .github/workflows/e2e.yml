name: Product E2E

on:
  schedule:
    - cron: '0 19 * * *'
  # THR291seq277: root-owned main-only on-demand verification after reviewed corrections; no blind retry.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cells:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main')
    name: Product E2E (Python ${{ matrix.python }}, Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - name: Start cleanup-inclusive clock
        run: python3 -c 'import time; print("E2E_STARTED_MONOTONIC=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Execute standalone public-process E2E
        run: |
          set -euo pipefail
          uv python install '${{ matrix.python }}'
          e2e_python="$(uv python find '${{ matrix.python }}')"
          e2e_npm_cache="$(npm config get cache)"
          [[ "$e2e_npm_cache" == /* && "$e2e_npm_cache" != / && "$e2e_npm_cache" != *$'\n'* && "$e2e_npm_cache" != *$'\r'* ]] || { echo 'Invalid runner npm cache path' >&2; exit 1; }
          E2E_NPM_DOWNLOAD_STORE="${e2e_npm_cache%/}/_cacache" python3 e2e/run.py --python "$e2e_python" --artifacts "$RUNNER_TEMP/e2e-${{ matrix.python }}"
      - name: Publish sanitized observations and absence receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ matrix.python }}
          path: ${{ runner.temp }}/e2e-${{ matrix.python }}
          if-no-files-found: error
          retention-days: 7

  cancellation:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main')
    name: E2E launcher cancellation (${{ matrix.signal }}, Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.12', signal: TERM}
          - {python: '3.14', signal: INT}
    steps:
      - name: Start cleanup-inclusive clock
        run: python3 -c 'import time; print("E2E_STARTED_MONOTONIC=" + str(time.monotonic()))' >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Signal the active owned launcher and verify closure
        run: |
          set -euo pipefail
          uv python install '${{ matrix.python }}'
          e2e_python="$(uv python find '${{ matrix.python }}')"
          e2e_npm_cache="$(npm config get cache)"
          [[ "$e2e_npm_cache" == /* && "$e2e_npm_cache" != / && "$e2e_npm_cache" != *$'\n'* && "$e2e_npm_cache" != *$'\r'* ]] || { echo 'Invalid runner npm cache path' >&2; exit 1; }
          E2E_NPM_DOWNLOAD_STORE="${e2e_npm_cache%/}/_cacache" python3 e2e/cancellation.py --python "$e2e_python" --signal '${{ matrix.signal }}' --artifacts "$RUNNER_TEMP/e2e-cancel-${{ matrix.signal }}"
      - name: Publish signal, non-success and owned closure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-cancel-${{ matrix.signal }}
          path: ${{ runner.temp }}/e2e-cancel-${{ matrix.signal }}
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: Daily Product E2E Health
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main')) }}
    needs: [cells, cancellation]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: e2e-*
          path: e2e-results
      - name: Check aggregate refusal controls (harness only)
        if: always()
        run: python3 e2e/aggregate.py --controls
      - name: "Report event health: exact source, all cells, diagnostics and cleanup"
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          MATRIX_RESULT: ${{ needs.cells.result }}
          CANCELLATION_RESULT: ${{ needs.cancellation.result }}
        run: python3 e2e/aggregate.py --artifacts e2e-results --source "$SOURCE_SHA" --event "$EVENT" --matrix-result "$MATRIX_RESULT" --cancellation-result "$CANCELLATION_RESULT"
