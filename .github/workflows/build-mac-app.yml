name: Build macOS App

# Internal unsigned candidate venue only. Never a PR/main merge build gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (three numeric components)
        required: true
      build:
        description: Candidate build (three numeric components)
        required: true
      source_sha:
        description: Full independently reviewed commit SHA
        required: true
      source_tree:
        description: Full independently reviewed tree SHA
        required: true
  push:
    tags: ['v*']

jobs:
  build:
    name: Build HappyRanch.app (macOS arm64, unsigned)
    runs-on: macos-15
    # Explicit steps total at most 85 minutes, leaving 10 for action finalization.
    # Runner loss/job cancellation can still prevent diagnostics from uploading.
    timeout-minutes: 95
    env:
      # Stay on the pinned graph's Go 1.23 line; see the maintenance limit in
      # app/mac/README.md. Never auto-download a substitute toolchain.
      NATIVE_GO_VERSION: '1.23.12'
      GOTOOLCHAIN: local
    steps:
      - name: Checkout exact candidate
        timeout-minutes: 5
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Reserve private candidate run directory
        id: run_paths
        timeout-minutes: 1
        run: |
          set -euo pipefail
          umask 077
          run_root="$(mktemp -d "$RUNNER_TEMP/happyranch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          run_root="$(cd "$run_root" && pwd -P)"
          printf 'root=%s\noutput=%s/output\noriginals=%s/web-originals\n' "$run_root" "$run_root" "$run_root" >> "$GITHUB_OUTPUT"
          printf 'Run directory allocated; candidate build not started.\n' > "$run_root/setup-status.txt"

      - name: Select Xcode 16
        timeout-minutes: 2
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install uv and native Python
        timeout-minutes: 5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Set up exact native Go
        timeout-minutes: 5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.NATIVE_GO_VERSION }}
          architecture: arm64
          check-latest: false
          cache: false

      - name: Verify effective native Go before packaging
        timeout-minutes: 2
        run: |
          set -euo pipefail
          printf 'PATH=%s\n' "$PATH"
          uname -s
          uname -m
          [ "$(uname -s)" = Darwin ] || { echo NATIVE_VENUE_UNAVAILABLE >&2; exit 1; }
          [ "$(uname -m)" = arm64 ] || { echo RELEASE_HOST_ARCH_MISMATCH >&2; exit 1; }
          go_path="$(command -v go)" || { echo BUILD_TOOL_MISSING: go >&2; exit 1; }
          printf 'go executable=%s\n' "$go_path"
          go version
          go env GOVERSION GOHOSTOS GOHOSTARCH GOTOOLCHAIN
          [ "$(go env GOVERSION)" = "go${NATIVE_GO_VERSION}" ] || { echo GO_VERSION_MISMATCH >&2; exit 1; }
          [ "$(go env GOHOSTOS)" = darwin ] || { echo GO_HOST_OS_MISMATCH >&2; exit 1; }
          [ "$(go env GOHOSTARCH)" = arm64 ] || { echo GO_HOST_ARCH_MISMATCH >&2; exit 1; }
          [ "$(go env GOTOOLCHAIN)" = local ] || { echo GO_TOOLCHAIN_MISMATCH >&2; exit 1; }

      - name: Build and inspect exact unsigned candidate
        id: build_candidate
        # Includes original preparation, packaging and its bounded diagnostics.
        timeout-minutes: 45
        env:
          RUN_ROOT: ${{ steps.run_paths.outputs.root }}
          CANDIDATE_OUTPUT: ${{ steps.run_paths.outputs.output }}
          WEB_ORIGINALS: ${{ steps.run_paths.outputs.originals }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            build="$INPUT_BUILD"
            sha="$INPUT_SHA"
            tree="$INPUT_TREE"
          else
            version="${GITHUB_REF_NAME#v}"
            build="$version"
            sha="$GITHUB_SHA"
            tree="$(git rev-parse HEAD^{tree})"
          fi
          printf 'Preparing web originals; candidate build not started.\n' > "$RUN_ROOT/setup-status.txt"
          originals="$WEB_ORIGINALS"
          python3 app/mac/scripts/prepare_web_originals.py --source "$GITHUB_WORKSPACE" --destination "$originals"
          printf 'Invoking build-app; inspect available preflight and bounded diagnostics for outcome.\n' > "$RUN_ROOT/setup-status.txt"
          bash app/mac/scripts/build-app.sh --version "$version" --build "$build" \
            --source-sha "$sha" --source-tree "$tree" --arch arm64 \
            --web-tool-originals "$originals" \
            --output-dir "$CANDIDATE_OUTPUT"
          candidate_zip="$CANDIDATE_OUTPUT/HappyRanch-${version}-${build}-arm64.zip"
          [ -f "$candidate_zip" ] && [ -f "$CANDIDATE_OUTPUT/build-receipt.json" ] || {
            echo CANDIDATE_OUTPUT_MISSING >&2; exit 1;
          }
          # Keep the documented upload path; admit exactly the expected ZIP.
          # A second candidate-like ZIP, including diagnostics, fails closed.
          set -- "$CANDIDATE_OUTPUT"/HappyRanch-*.zip
          [ "$#" -eq 1 ] && [ "$1" = "$candidate_zip" ] || {
            echo CANDIDATE_ZIP_SELECTION_INVALID >&2; exit 1;
          }

      - name: Upload successful internal candidate and exact inner receipt
        if: ${{ success() && !cancelled() && steps.build_candidate.outcome == 'success' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: HappyRanch-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ steps.run_paths.outputs.output }}/HappyRanch-*.zip
            ${{ steps.run_paths.outputs.output }}/build-receipt.json
            ${{ steps.run_paths.outputs.output }}/diagnostics/*.json

      - name: Retain bounded failure diagnostics
        # Best effort: cancellation or runner loss may interrupt packaging/upload.
        if: failure() && steps.run_paths.outputs.root != ''
        timeout-minutes: 5
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: HappyRanch-diagnostics-only-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ steps.run_paths.outputs.root }}/setup-status.txt
            ${{ steps.run_paths.outputs.output }}/preflight.json
            ${{ steps.run_paths.outputs.output }}/diagnostics/bounded/*

      - name: Retain bounded cancellation diagnostics
        # Failure already selects the preceding upload; never write it twice.
        # Best effort: cancellation or runner loss may interrupt packaging/upload.
        if: ${{ cancelled() && !failure() && steps.run_paths.outputs.root != '' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: HappyRanch-diagnostics-only-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ steps.run_paths.outputs.root }}/setup-status.txt
            ${{ steps.run_paths.outputs.output }}/preflight.json
            ${{ steps.run_paths.outputs.output }}/diagnostics/bounded/*
