name: Build macOS App

# Internal unsigned candidate venue only. Never a PR/main merge build gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (three numeric components)
        required: true
      build:
        description: Candidate build (three numeric components)
        required: true
      source_sha:
        description: Full independently reviewed commit SHA
        required: true
      source_tree:
        description: Full independently reviewed tree SHA
        required: true
  push:
    tags: ['v*']

jobs:
  build:
    name: Build HappyRanch.app (macOS arm64, unsigned)
    runs-on: macos-15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install uv and native Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build and inspect exact unsigned candidate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_TREE: ${{ inputs.source_tree }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
            build="$INPUT_BUILD"
            sha="$INPUT_SHA"
            tree="$INPUT_TREE"
          else
            version="${GITHUB_REF_NAME#v}"
            build="$version"
            sha="$GITHUB_SHA"
            tree="$(git rev-parse HEAD^{tree})"
          fi
          bash app/mac/scripts/build-app.sh --version "$version" --build "$build" \
            --source-sha "$sha" --source-tree "$tree" --arch arm64 \
            --output-dir "$RUNNER_TEMP/happyranch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload successful internal candidate and exact inner receipt
        if: success()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: HappyRanch-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/happyranch-${{ github.run_id }}-${{ github.run_attempt }}/HappyRanch-*.zip
            ${{ runner.temp }}/happyranch-${{ github.run_id }}-${{ github.run_attempt }}/build-receipt.json
            ${{ runner.temp }}/happyranch-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics/*.json

      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: HappyRanch-diagnostics-only-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/happyranch-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            ${{ runner.temp }}/happyranch-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics/bounded/*
