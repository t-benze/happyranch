name: Lab capacity (managed remote access, unit D)

# LAB-ONLY capacity spike runner for the managed remote-access design
# (merge unit D). Runs disposable headscale cells + synthetic tailscale
# clients on an isolated ubuntu-latest runner (docker preinstalled) and
# uploads machine-readable raw results as a CI artifact.
#
# Triggers:
#   1. workflow_dispatch — manual reruns once the file is on the default
#      branch (GitHub only registers dispatchable workflows from main):
#        gh workflow run "Lab capacity (managed remote access, unit D)" --ref <branch>
#   2. pull_request — automatic "CI-style local invocation" ONLY when a PR
#      changes the lab harness itself (path-gated), so lab PRs self-test
#      the reusable harness on the disposable runner. Raw results
#      commits (results/**) do NOT re-trigger the run.
#
# The runner is disposable and isolated: it cannot target non-lab
# endpoints (all URLs are internal to the run's docker network; DERP and
# DNS are disabled) and is destroyed after the job.

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenarios or "all" (idle,nodes,churn,restart,failure)'
        required: false
        default: all
      run_id:
        description: 'Optional explicit synthetic run id (auto-generated when empty)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'labs/managed-remote-access/capacity/harness/**'
      - 'labs/managed-remote-access/capacity/run_capacity_lab.sh'
      - '.github/workflows/lab-capacity.yml'

jobs:
  capacity:
    name: Capacity lab (ubuntu-latest, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Run capacity lab
        run: >-
          bash labs/managed-remote-access/capacity/run_capacity_lab.sh
          --scenarios "${{ inputs.scenarios || 'all' }}"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: lab-capacity-results
          path: labs/managed-remote-access/capacity/results/
          if-no-files-found: error
