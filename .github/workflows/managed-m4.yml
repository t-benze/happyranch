name: Managed M4 macOS tailnet

# Manual post-merge native acceptance only; required CI and daily E2E unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-m4-hk-cell
  cancel-in-progress: false

jobs:
  managed-m4:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.12'
          cache: false
      - name: Use the runner's existing OpenSSL 3
        run: |
          set -euo pipefail
          M4_OPENSSL_BIN="$(brew --prefix openssl@3)/bin"
          test -x "$M4_OPENSSL_BIN/openssl"
          echo "$M4_OPENSSL_BIN" >> "$GITHUB_PATH"
      - name: Build unchanged archive and create ephemeral recipient
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/m4_tailnet_runner.py prepare --scratch "$RUNNER_TEMP/managed-m4-private" --output "$RUNNER_TEMP/managed-m4-public"
      - name: Publish public recipient request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-m4-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/managed-m4-public/request.json
          if-no-files-found: error
          retention-days: 1
      - name: Exercise existing C ABI against the coordinated real VM cell
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/m4_tailnet_runner.py run --scratch "$RUNNER_TEMP/managed-m4-private" --output "$RUNNER_TEMP/managed-m4-public"
      - name: Remove private key and native client state
        if: always()
        run: python3 scripts/ci/m4_tailnet_runner.py cleanup --scratch "$RUNNER_TEMP/managed-m4-private" --output "$RUNNER_TEMP/managed-m4-public"
      - name: Upload plain public logs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-m4-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/managed-m4-public/request.json
            ${{ runner.temp }}/managed-m4-public/client-summary.json
          if-no-files-found: error
          retention-days: 14
