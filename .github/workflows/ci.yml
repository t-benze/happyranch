name: CI

on:
  pull_request:
  push:
    branches: [main, 'task/TASK-6475']

jobs:
  # THR-291 seq40: Python units and their gate are retired.
  # THR-291 seq69: PR/main automation is lint/static only.
  # Behavioral sources survive; Product E2E runs in its separate daily workflow.
  source-boundary-lint:
    name: Source Boundary Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
      - name: Check actual source boundaries
        run: uv run --no-project --python 3.14 python scripts/check_source_boundaries.py
      - name: Validate lint CLI with isolated synthetic sources
        run: uv run --no-project --python 3.14 python scripts/validate_source_boundaries.py

  web:
    name: Web Lint (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Design-system colour gate
        run: bash scripts/verify-design-system-colour-gate.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  managed-n3-real-systemd:
    name: Managed installer-only observation (Ubuntu 24.04)
    # Founder THR327seq96 / ROOT14238: exact published Hprime110e5d7->candidate only.
    # Any publication/automatic attempt remains manager-owned after renewed gates.
    # Same allowance4counted/0reserved/2remaining; five physical effects. Only42124081991 excluded.
    if: >-
      ${{ github.event_name == 'push' &&
          github.repository == 't-benze/happyranch' &&
          github.ref == 'refs/heads/task/TASK-6475' &&
          github.event.repository.full_name == github.repository &&
          github.event.created == false && github.event.deleted == false &&
          github.event.forced == false &&
          github.event.before == '110e5d7db017236ec89acda7833a1556704a6cef' &&
          github.event.after != github.event.before &&
          github.event.after == github.sha && github.run_attempt == '1' }}
    concurrency:
      group: managed-n3-pr800-sole-diagnostic
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Admit sole push before checkout or build effects
        run: |
          set -euo pipefail
          N3_ADMISSION_HOME="${RUNNER_TEMP}/managed-n3-admission-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -- "$N3_ADMISSION_HOME" 2>/dev/null || { echo '{"site":"A200001","category":"admission_home"}'; exit 1; }
          export N3_ADMISSION_HOME
          echo "N3_ADMISSION_HOME=$N3_ADMISSION_HOME" 2>/dev/null >> "$GITHUB_ENV" || { echo '{"site":"A200002","category":"admission_environment"}'; exit 1; }
          cat 2>/dev/null > "$N3_ADMISSION_HOME/admit.py" <<'PYGUARD' || { echo '{"site":"A200003","category":"admission_source"}'; exit 1; }
          import http.client
          import json
          import math
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import time
          from contextlib import contextmanager

          P = "/repos/t-benze/happyranch"
          B = "110e5d7db017236ec89acda7833a1556704a6cef"
          ADMISSION_HOME = Path(os.environ["N3_ADMISSION_HOME"])
          STATE = ADMISSION_HOME / "status.json"
          start = time.monotonic()
          account = {"deadline": start + 1200, "active": 0, "requests": 0, "bodies": 0, "headers": 0, "event": None, "tree": None, "check1": "refused", "check2": "unreached", "operation": "startup", "origin": None, "losses": [], "predicate": None}


          class Refusal(Exception):
              def __init__(self, site, category):
                  self.identity = {"site": site, "category": category, "operation": account["operation"]}


          def refuse(site, category):
              failure = Refusal(site, category)
              record(failure)  # Latch at the producer, before any fallible unwinding.
              raise failure


          @contextmanager
          def boundary(site, category):
              # Precisely scoped fallible operations; an already identified origin survives.
              try:
                  yield
              except Refusal as failure:
                  record(failure)
                  raise
              except BaseException:
                  refuse(site, category)


          def record(error):
              if account["origin"] is None:
                  account["origin"] = error.identity
              elif (error.identity != account["origin"] and error.identity not in account["losses"]
                    and len(account["losses"]) < 4):
                  account["losses"].append(error.identity)


          def closed_json(raw):
              def pairs(items):
                  out = {}
                  for key, value in items:
                      if key in out:
                          refuse("A000001", "json_duplicate")
                      out[key] = value
                  return out
              def invalid(_value):
                  refuse("A000002", "json_constant")
              with boundary("A000003", "json_decode"):
                  obj = json.loads(raw.decode("utf-8", "strict"), object_pairs_hook=pairs, parse_constant=invalid)
              pending = [(obj, 0)]
              count = 0
              while pending:
                  item, depth = pending.pop()
                  count += 1
                  if depth > 32:
                      refuse("A000004", "json_depth")
                  if count > 20000:
                      refuse("A000005", "json_nodes")
                  if type(item) is float and not math.isfinite(item):
                      refuse("A000006", "json_number")
                  if type(item) is dict:
                      pending.extend((k, depth + 1) for k in item)
                      pending.extend((v, depth + 1) for v in item.values())
                  elif type(item) is list:
                      pending.extend((v, depth + 1) for v in item)
              return obj


          def read_file(path, cap):
              with boundary("A000090", "file_open"):
                  stream = open(path, "rb")
              error = None
              try:
                  with boundary("A000091", "file_read"):
                      return stream.read(cap + 1)
              except Refusal as failure:
                  error = failure
                  record(failure)
                  raise
              finally:
                  try:
                      with boundary("A000092", "file_close"):
                          stream.close()
                  except Refusal as failure:
                      record(failure)
                      if error is None:
                          raise


          RUN_STATUSES = ("queued", "in_progress", "completed", "waiting", "requested", "pending")
          RUN_CONCLUSIONS = ("action_required", "cancelled", "failure", "neutral", "skipped", "stale", "success", "timed_out", "startup_failure")
          VALUE_LOSSES = ("missing", "invalid", "unknown", "unsafe", "truncated")


          def run_field(run, name, values, nullable=False):
              # No unrecognized API operand is ever copied into retained evidence.
              if name not in run:
                  return ["missing", None]
              value = run[name]
              if nullable and value is None:
                  return ["value", None]
              if type(value) is not str:
                  return ["invalid", None]
              if len(value) > 32:
                  return ["truncated", None]
              if re.fullmatch(r"[a-z_]+", value) is None:
                  return ["unsafe", None]
              return ["value", value] if value in values else ["unknown", None]


          def run_predicate(run):
              return {"version": 1, "expected": ["in_progress", None],
                      "observed": [run_field(run, "status", RUN_STATUSES), run_field(run, "conclusion", RUN_CONCLUSIONS, True)]}


          def encode_account():
              predicate = account["predicate"]
              if predicate is not None:
                  if (type(predicate) is not dict or set(predicate) != {"version", "expected", "observed"}
                          or type(predicate["version"]) is not int or predicate["version"] != 1
                          or predicate["expected"] != ["in_progress", None]
                          or type(predicate["observed"]) is not list or len(predicate["observed"]) != 2):
                      raise ValueError
                  for index, field in enumerate(predicate["observed"]):
                      if type(field) is not list or len(field) != 2 or type(field[0]) is not str:
                          raise ValueError
                      state, value = field
                      if state == "value":
                          values = RUN_CONCLUSIONS if index else RUN_STATUSES
                          if not (index == 1 and value is None) and (type(value) is not str or value not in values):
                              raise ValueError
                      elif state not in VALUE_LOSSES or value is not None:
                          raise ValueError
              return json.dumps(account, sort_keys=True, separators=(",", ":")) + "\n"


          def save():
              with boundary("A000007", "retention_encode"):
                  raw = encode_account()
              # Two fixed snapshots together fit below the existing 16384-byte state cap.
              if len(raw) > 4096:
                  refuse("A000008", "retention_size")
              pending = ADMISSION_HOME / "status.pending"
              with boundary("A000009", "retention_open"):
                  stream = pending.open("x", encoding="ascii")
              error = None
              try:
                  with boundary("A000010", "retention_write"):
                      if stream.write(raw) != len(raw):
                          refuse("A000011", "retention_short_write")
                  with boundary("A000101", "retention_flush"):
                      stream.flush()
              except Refusal as failure:
                  error = failure
                  record(failure)
                  raise
              finally:
                  try:
                      with boundary("A000012", "retention_close"):
                          stream.close()
                  except Refusal as failure:
                      record(failure)
                      if error is None:
                          raise
              with boundary("A000013", "retention_replace"):
                  os.replace(pending, STATE)


          def remaining():
              now = time.monotonic()
              if now - start >= 10:
                  refuse("A000014", "deadline_check")
              if account["active"] + now - start >= 20:
                  refuse("A000015", "deadline_active")
              if now >= account["deadline"]:
                  refuse("A000016", "deadline_absolute")
              return min(2, 10 - (now - start), 20 - account["active"] - (now - start), account["deadline"] - now)


          # Header acquisition is bounded before the stdlib parser consumes it. It
          # includes status lines/interim responses; no redirect/auth/proxy fallback.
          class HeaderStream:
              def __init__(self, stream, sock):
                  self.stream, self.sock = stream, sock
                  self.used = 0
              def readline(self, limit=-1):
                  with boundary("A000017", "header_transport"):
                      self.sock.settimeout(remaining())
                      cap = 16384 - self.used
                      if cap <= 0:
                          refuse("A000018", "header_size")
                      raw = self.stream.readline(min(cap, limit) if limit > 0 else cap)
                  if self.used == 0 and not (raw.startswith(b"HTTP/1.1 200 ") or raw.startswith(b"HTTP/1.0 200 ")):
                      refuse("A000019", "http_status_line")
                  # Also debit chunk framing/trailers conservatively.
                  self.used += len(raw)
                  account["headers"] += len(raw)
                  if account["headers"] > 229376:
                      refuse("A000020", "header_aggregate")
                  if not raw.endswith(b"\n"):
                      refuse("A000021", "header_partial")
                  return raw
              def read(self, size=-1):
                  with boundary("A000094", "body_stream_read"):
                      return self.stream.read(size)
              def read1(self, size=-1):
                  with boundary("A000095", "body_stream_read1"):
                      return self.stream.read1(size)
              def close(self):
                  # Called by the existing HTTPResponse owner, including begin failure.
                  with boundary("A000093", "response_stream_close"):
                      self.stream.close()
              def __getattr__(self, name):
                  return getattr(self.stream, name)


          class HeaderSocket:
              def __init__(self, sock):
                  self.sock = sock
              def makefile(self, mode):
                  with boundary("A000022", "header_stream_open"):
                      return HeaderStream(self.sock.makefile(mode), self.sock)
              def close(self):
                  # Observe the stdlib socket close before its response-close finally.
                  with boundary("A000096", "socket_close"):
                      self.sock.close()
              def __getattr__(self, name):
                  return getattr(self.sock, name)


          class Response(http.client.HTTPResponse):
              def __init__(self, sock, *args, **kwargs):
                  with boundary("A000023", "header_response_init"):
                      super().__init__(sock, *args, **kwargs)
              def begin(self):
                  with boundary("A000097", "response_begin"):
                      return super().begin()
              def read1(self, size=-1):
                  with boundary("A000098", "body_parse"):
                      return super().read1(size)
              def close(self):
                  with boundary("A000099", "response_close"):
                      return super().close()
              def _read_next_chunk_size(self):
                  # Same stdlib parser and once-only failure close. Its ValueError
                  # otherwise crosses _close_conn before the caller can identify it.
                  line = self.fp.readline(http.client._MAXLINE + 1)
                  if len(line) > http.client._MAXLINE:
                      refuse("A000100", "chunk_line_size")
                  line = line.split(b";", 1)[0]
                  try:
                      return int(line, 16)
                  except ValueError:
                      failure = Refusal("A000102", "chunk_size_parse")
                      record(failure)
                      self._close_conn()
                      raise failure


          def get(path, operation):
              account["operation"] = operation
              account["requests"] += 1
              if account["requests"] > 14:
                  refuse("A000024", "request_count")
              with boundary("A000025", "request_init"):
                  connection = http.client.HTTPSConnection("api.github.com", 443, timeout=remaining())
                  connection.response_class = Response
              error = None
              try:
                  with boundary("A000026", "request_connect"):
                      connection.connect()
                      connection.sock = HeaderSocket(connection.sock)
                      sock = connection.sock
                  with boundary("A000027", "request_send"):
                      connection.request("GET", path, headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2026-03-10", "User-Agent": "happyranch-pr800-admission", "Accept-Encoding": "identity", "Connection": "close", "Cache-Control": "no-cache"})
                  with boundary("A000028", "header_parse"):
                      response = connection.getresponse()
                      headers = response.getheaders()
                  for name in ("Content-Type", "Content-Length", "Content-Encoding", "Transfer-Encoding", "Link"):
                      if len([v for k, v in headers if k.lower() == name.lower()]) > 1:
                          refuse("A000029", "header_duplicate")
                  if response.status != 200:
                      refuse("A000030", "http_status")
                  if response.getheader("Content-Encoding", "identity") != "identity":
                      refuse("A000031", "header_encoding")
                  if response.getheader("Content-Type", "").split(";", 1)[0].strip().lower() not in ("application/json", "application/vnd.github+json"):
                      refuse("A000032", "header_content_type")
                  length = response.getheader("Content-Length")
                  if length is not None:
                      if re.fullmatch(r"0|[1-9][0-9]*", length) is None:
                          refuse("A000033", "length_format")
                      with boundary("A000034", "length_number"):
                          declared = int(length)
                      if declared > 524288:
                          refuse("A000035", "length_size")
                  body = bytearray()
                  while True:
                      with boundary("A000036", "body_transport"):
                          sock.settimeout(remaining())
                          available = min(65536, 524288 - len(body), 4194304 - account["bodies"])
                          if available <= 0:
                              refuse("A000037", "body_capacity")
                          chunk = response.read1(available)
                      account["bodies"] += len(chunk)
                      body.extend(chunk)
                      if len(body) > 524288 or account["bodies"] > 4194304:
                          refuse("A000038", "body_size")
                      if not chunk or response.isclosed():
                          break
                  if length is not None and len(body) != declared:
                      refuse("A000039", "length_mismatch")
                  if 'rel="next"' in response.getheader("Link", "") or "rel=next" in response.getheader("Link", ""):
                      refuse("A000040", "header_pagination")
                  return closed_json(bytes(body))
              except Refusal as failure:
                  error = failure
                  record(failure)
                  raise
              finally:
                  try:
                      with boundary("A000041", "request_close"):
                          connection.close()
                  except Refusal as failure:
                      record(failure)
                      if error is None:
                          raise


          def canonical_sha(value):
              if type(value) is not str or re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  refuse("A000042", "identity_sha")
              return value


          def positive(value):
              if type(value) is not int or not 0 < value <= 2**63 - 1:
                  refuse("A000043", "identity_positive")
              return value


          def pr_tuple(pr):
              with boundary("A000044", "pr_schema"):
                  if type(pr.get("number")) is not int or pr["number"] != 800:
                      refuse("A000045", "pr_number")
                  if pr.get("state") != "open" or pr.get("merged") is not False or pr.get("draft") is not False:
                      refuse("A000046", "pr_status")
                  if pr["head"]["ref"] != "task/TASK-6475" or pr["head"]["sha"] != C or pr["base"]["ref"] != "main":
                      refuse("A000047", "pr_refs")
                  for role in ("head", "base"):
                      repo = pr[role]["repo"]
                      if type(repo.get("id")) is not int or repo["id"] != 1207510174 or repo.get("full_name") != "t-benze/happyranch" or repo.get("private") is not False:
                          refuse("A000048", "pr_repository")
                  return (800, C, "task/TASK-6475", "main", 1207510174)


          def run_tuple(run):
              with boundary("A000049", "run_schema"):
                  if positive(run["id"]) != R:
                      refuse("A000050", "run_id")
                  if type(run.get("run_attempt")) is not int or run["run_attempt"] != 1:
                      refuse("A000051", "run_attempt")
                  if type(run.get("workflow_id")) is not int or run["workflow_id"] != 293424328 or run["path"] != ".github/workflows/ci.yml":
                      refuse("A000052", "run_workflow")
                  if run["head_sha"] != C or run["head_branch"] != "task/TASK-6475" or run["event"] != "push":
                      refuse("A000053", "run_source")
                  # Capture at the actual predicate, before any fallible unwind.
                  # Missing fields still refuse at the original run_schema boundary.
                  account["predicate"] = run_predicate(run)
                  if run["status"] != "in_progress":
                      refuse("A000054", "run_status")
                  if run["conclusion"] is not None:
                      refuse("A000055", "run_conclusion")
                  account["predicate"] = None
                  for name in ("repository", "head_repository"):
                      repo = run[name]
                      if type(repo.get("id")) is not int or repo["id"] != 1207510174 or repo.get("full_name") != "t-benze/happyranch" or repo.get("private") is not False:
                          refuse("A000056", "run_repository")
                  created = run["created_at"]
                  if type(created) is not str or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", created) is None:
                      refuse("A000057", "run_created")
                  return (R, 1, C, 293424328, positive(run["check_suite_id"]), created)


          def singleton(doc):
              with boundary("A000058", "singleton_schema"):
                  if type(doc.get("total_count")) is not int or doc["total_count"] != 1:
                      refuse("A000059", "singleton_count")
                  if type(doc.get("workflow_runs")) is not list or len(doc["workflow_runs"]) != 1:
                      refuse("A000060", "singleton_runs")
                  return run_tuple(doc["workflow_runs"][0])


          error = None
          check = 1
          try:
              with boundary("A000061", "check_argument"):
                  check = int(sys.argv[1])
              if check == 2:
                  account["check2"] = "refused"
                  account["operation"] = "state_load"
                  with boundary("A000062", "state_read"):
                      raw = read_file(STATE, 16384)
                  if len(raw) > 16384:
                      refuse("A000063", "state_size")
                  loaded = closed_json(raw)
                  if type(loaded) is not dict or set(loaded) != set(account) or loaded["check1"] != "allowed" or loaded["check2"] != "unreached":
                      refuse("A000064", "state_schema")
                  if (type(loaded["active"]) not in (int, float) or not 0 <= loaded["active"] < 20
                          or type(loaded["deadline"]) not in (int, float) or not math.isfinite(loaded["deadline"])
                          or type(loaded["requests"]) is not int or loaded["requests"] != 7
                          or type(loaded["bodies"]) is not int or not 0 <= loaded["bodies"] <= 4194304
                          or type(loaded["headers"]) is not int or not 0 <= loaded["headers"] <= 229376):
                      refuse("A000065", "state_accounting")
                  if loaded["origin"] is not None or loaded["losses"] != [] or loaded["operation"] != "closing_pr" or loaded["predicate"] is not None:
                      refuse("A000066", "state_diagnostic")
                  original = loaded["event"]
                  if type(original) is not dict or set(original) != {"before", "head", "run_id", "attempt"}:
                      refuse("A000067", "state_event")
                  canonical_sha(original["head"])
                  canonical_sha(loaded["tree"])
                  if original["before"] != B or type(original["attempt"]) is not int or original["attempt"] != 1:
                      refuse("A000068", "state_source")
                  positive(original["run_id"])
                  # Adopt only complete validated state, never malformed raw diagnostic data.
                  account = loaded
                  account["check2"] = "refused"
                  account["operation"] = "state_load"
              elif check != 1:
                  refuse("A000069", "check_number")
              save()  # Fail-closed default before any dependent effect.
              with boundary("A000070", "environment_read"):
                  run_id = os.environ["GITHUB_RUN_ID"]
              if re.fullmatch(r"[1-9][0-9]{0,18}", run_id) is None:
                  refuse("A000071", "environment_run_id")
              R = positive(int(run_id))
              if check == 1:
                  account["operation"] = "event_load"
                  with boundary("A000072", "event_read"):
                      raw = read_file(os.environ["GITHUB_EVENT_PATH"], 262144)
                  if len(raw) > 262144:
                      refuse("A000073", "event_size")
                  event = closed_json(raw)
                  with boundary("A000074", "event_schema"):
                      C = canonical_sha(event["after"])
                      if (event["ref"] != "refs/heads/task/TASK-6475" or event["before"] != B
                              or any(event[k] is not False for k in ("created", "deleted", "forced"))
                              or type(event["repository"]["id"]) is not int or event["repository"]["id"] != 1207510174
                              or event["repository"]["full_name"] != "t-benze/happyranch" or event["repository"]["private"] is not False):
                          refuse("A000075", "event_identity")
              else:
                  C = original["head"]
              with boundary("A000076", "environment_schema"):
                  if (os.environ["GITHUB_EVENT_NAME"] != "push" or os.environ["GITHUB_RUN_ATTEMPT"] != "1"
                          or os.environ["GITHUB_REPOSITORY"] != "t-benze/happyranch" or os.environ["GITHUB_REF"] != "refs/heads/task/TASK-6475"
                          or os.environ["GITHUB_WORKFLOW_REF"] != "t-benze/happyranch/.github/workflows/ci.yml@refs/heads/task/TASK-6475"
                          or C == B or os.environ["GITHUB_SHA"] != C):
                      refuse("A000077", "environment_identity")
              identity = {"before": B, "head": C, "run_id": R, "attempt": 1}
              if check == 2 and account["event"] != identity:
                  refuse("A000078", "state_identity")
              account["event"] = identity
              if check == 2:
                  account["operation"] = "checkout"
                  with boundary("A000079", "checkout_read"):
                      head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True, timeout=remaining(), stderr=subprocess.DEVNULL).strip()
                      tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True, timeout=remaining(), stderr=subprocess.DEVNULL).strip()
                  with boundary("A000080", "checkout_dirty"):
                      subprocess.check_call(["git", "diff", "--quiet", "HEAD", "--"], timeout=remaining(), stderr=subprocess.DEVNULL)
                  if head != C or canonical_sha(tree) != account["tree"]:
                      refuse("A000081", "checkout_identity")
                  with boundary("A000082", "composition_transport"):
                      subprocess.check_call([sys.executable, str(ADMISSION_HOME / "composition.py")], timeout=remaining())
              opening_pr = pr_tuple(get(P + "/pulls/800", "opening_pr"))
              workflow = get(P + "/actions/workflows/293424328", "workflow")
              with boundary("A000083", "workflow_schema"):
                  if type(workflow.get("id")) is not int or workflow["id"] != 293424328 or workflow.get("path") != ".github/workflows/ci.yml" or workflow.get("state") != "active" or workflow.get("name") != "CI":
                      refuse("A000084", "workflow_identity")
              own = run_tuple(get(P + "/actions/runs/" + str(R), "own_run"))
