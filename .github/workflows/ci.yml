            ${{ env.ROSTER_INVOCATION }}/binding-refusals.json
            ${{ env.ROSTER_INVOCATION }}/browser-binding.json
            ${{ env.ROSTER_INVOCATION }}/registry-integrities.json
            ${{ env.ROSTER_INVOCATION }}/tool-file-origins.json
            ${{ env.ROSTER_INVOCATION }}/tools/package-lock.json
