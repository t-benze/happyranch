name: CI

on:
  pull_request:
  push:
    branches: [main, 'task/TASK-6475']

jobs:
  # THR-291 seq40: Python units and their gate are retired.
  # THR-291 seq69: PR/main automation is lint/static only.
  # Behavioral sources survive; Product E2E runs in its separate daily workflow.
  source-boundary-lint:
    name: Source Boundary Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
      - name: Check actual source boundaries
        run: uv run --no-project --python 3.14 python scripts/check_source_boundaries.py
      - name: Validate lint CLI with isolated synthetic sources
        run: uv run --no-project --python 3.14 python scripts/validate_source_boundaries.py

  web:
    name: Web Lint (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Design-system colour gate
        run: bash scripts/verify-design-system-colour-gate.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  managed-m1:
    name: Managed M1 install READY uninstall (Ubuntu 24.04)
    # Founder THR327seq131 / ROOT14460: sole hosted admission, no API readmission.
    if: >-
      ${{ github.event_name == 'push' &&
          github.ref == 'refs/heads/task/TASK-6475' &&
          github.event.after == github.sha && github.run_attempt == '1' }}
    concurrency:
      group: managed-m1-pr800
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      M1_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set runner temporary paths
        if: always()
        run: |
          {
            echo "M1_WORK=$RUNNER_TEMP/managed-m1-fixture"
            echo "M1_LOGS=$RUNNER_TEMP/managed-m1-logs"
            echo "M1_PACKAGE=$RUNNER_TEMP/managed-m1-package/happyranch-linux-amd64.tar"
          } >> "$GITHUB_ENV"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/linux/tsnet-sidecar/go.mod
          cache-dependency-path: app/linux/tsnet-sidecar/go.sum
      - name: Build package and print SHA256
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/managed-m1-package/build" "$M1_LOGS"
          build="$RUNNER_TEMP/managed-m1-package/build"
          uv sync --frozen --group build
          (cd app/linux/tsnet-sidecar && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$build/happyranch-tsnet-sidecar" ./cmd/happyranch-tsnet-sidecar)
          uv build --wheel --out-dir "$build"
          wheels=("$build"/*.whl)
          [[ ${#wheels[@]} == 1 && -f ${wheels[0]} ]]
          uv run python app/linux/package/build_connector.py --wheel "${wheels[0]}" --output "$build/happyranch-connector"
          uv run python app/linux/package/build_package.py --sidecar "$build/happyranch-tsnet-sidecar" --connector "$build/happyranch-connector" --wheel "${wheels[0]}" --version ci --output "$M1_PACKAGE"
          sha256sum "$M1_PACKAGE" | tee "$M1_PACKAGE.sha256"
      - name: Set up disposable fixture
        run: bash app/linux/package/m1_install_ready_uninstall.sh fixture
      - name: Install through product path
        run: bash app/linux/package/m1_install_ready_uninstall.sh install
      - name: Start and wait for both product READY signals
        run: bash app/linux/package/m1_install_ready_uninstall.sh ready
      - name: Uninstall through product path
        run: bash app/linux/package/m1_install_ready_uninstall.sh uninstall
      - name: Check installer residue and documented retained images
        run: |
          set -euo pipefail
          bash app/linux/package/m1_install_ready_uninstall.sh residue 2>&1 | tee "$M1_LOGS/residue.log"
      - name: Collect plain unit logs
        if: always()
        run: bash app/linux/package/m1_install_ready_uninstall.sh logs
      - name: Tear down fixture prerequisites
        if: always()
        run: bash app/linux/package/m1_install_ready_uninstall.sh teardown
      - name: Upload plain logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: managed-m1-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M1_LOGS }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload built package and digest
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: managed-m1-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.M1_PACKAGE }}
            ${{ env.M1_PACKAGE }}.sha256
          if-no-files-found: error
          retention-days: 90
