name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # THR-291 seq40: Python units and their gate are retired.
  # THR-291 seq69: PR/main automation is lint/static only.
  # Behavioral sources survive; Product E2E runs in its separate daily workflow.
  source-boundary-lint:
    name: Source Boundary Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.14"
      - name: Check actual source boundaries
        run: uv run --no-project --python 3.14 python scripts/check_source_boundaries.py
      - name: Validate lint CLI with isolated synthetic sources
        run: uv run --no-project --python 3.14 python scripts/validate_source_boundaries.py

  web:
    name: Web Lint (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Design-system colour gate
        run: bash scripts/verify-design-system-colour-gate.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
