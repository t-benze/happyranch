name: Managed start diagnostic
on:
  push:
    branches: [task/TASK-7435-diagnostic]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.event.created && !github.event.deleted && !github.event.forced && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Initialize failure-safe diagnostic receipt
        run: |
          set -euo pipefail
          diagnostics="${RUNNER_TEMP}/managed-start-diagnostic"; package_tmp="${RUNNER_TEMP}/managed-start-package"; publish="${RUNNER_TEMP}/managed-start-publish"
          mkdir -p "$diagnostics" "$package_tmp" "$publish"
          printf 'schema=managed-start-diagnostic-receipt-v1\nrun_id=%s\nrun_attempt=%s\n' "${GITHUB_RUN_ID//[^0-9]/unavailable}" "${GITHUB_RUN_ATTEMPT//[^0-9]/unavailable}" > "$diagnostics/receipt.txt"
          echo "DIAGNOSTICS=$diagnostics" >> "$GITHUB_ENV"
          echo "PACKAGE_TMP=$package_tmp" >> "$GITHUB_ENV"
          echo "PUBLISH=$publish" >> "$GITHUB_ENV"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {path: diagnostic}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with: {ref: 2147c5c6edb5d847e4c0ca855a044fa850fd7e11, path: shipping}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: {python-version: "3.14"}
      - name: Build pinned shipping package
        working-directory: shipping
        run: |
          set -uo pipefail
          package_tmp="${PACKAGE_TMP:-${RUNNER_TEMP}/managed-start-package}"; diagnostics="${DIAGNOSTICS:-${RUNNER_TEMP}/managed-start-diagnostic}"
          set +e
          { uv sync --frozen --group build && (cd app/linux/tsnet-sidecar && go test ./... && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$package_tmp/happyranch-tsnet-sidecar" ./cmd/happyranch-tsnet-sidecar) && uv build --wheel --out-dir "$package_tmp" && wheel="$(find "$package_tmp" -maxdepth 1 -name 'happyranch-*.whl' -print -quit)" && uv run python app/linux/package/build_connector.py --wheel "$wheel" --output "$package_tmp/happyranch-connector" && uv run python app/linux/package/build_package.py --sidecar "$package_tmp/happyranch-tsnet-sidecar" --connector "$package_tmp/happyranch-connector" --wheel "$wheel" --version ci --output "$package_tmp/happyranch-linux-amd64.tar"; } >"$package_tmp/build.raw" 2>&1
          status=$?; [[ -d "$diagnostics" ]] && printf 'build_status=%s\n' "$status" >> "$diagnostics/receipt.txt" || true; exit "$status"
      - name: Reuse pinned setup through first start
        working-directory: shipping
        run: |
          set -uo pipefail
          diagnostics="${DIAGNOSTICS:-${RUNNER_TEMP}/managed-start-diagnostic}"; package_tmp="${PACKAGE_TMP:-${RUNNER_TEMP}/managed-start-package}"
          set +e
          { python "$GITHUB_WORKSPACE/diagnostic/scripts/diagnostics/managed_start_diagnostic.py" --extract --shipping app/linux/package/real_systemd_n3.sh --output "$package_tmp/diagnostic-harness.sh" && PACKAGE_TAR="$package_tmp/happyranch-linux-amd64.tar" PROOF_SUBJECT_SHA=2147c5c6edb5d847e4c0ca855a044fa850fd7e11 N3_DIAGNOSTICS_DIR="$diagnostics" bash "$package_tmp/diagnostic-harness.sh"; } >"$package_tmp/harness.raw" 2>&1
          status=$?; [[ -d "$diagnostics" ]] && printf 'harness_status=%s\n' "$status" >> "$diagnostics/receipt.txt" || true; exit "$status"
      - name: Record provenance
        if: always()
        run: |
          set -euo pipefail
          diagnostics="${DIAGNOSTICS:-${RUNNER_TEMP}/managed-start-diagnostic}"; package_tmp="${PACKAGE_TMP:-${RUNNER_TEMP}/managed-start-package}"; publish="${PUBLISH:-${RUNNER_TEMP}/managed-start-publish}"
          sha() { value="$(sha256sum "$1" 2>/dev/null | awk '{print $1}' || true)"; printf '%s' "$value"; }
          git_id() { [[ -d "$1" ]] || return 0; value="$(git -C "$1" rev-parse HEAD 2>/dev/null || true)"; printf '%s' "$value"; }
          systemd="$(systemctl --version 2>/dev/null | sed -nE '1s/^systemd ([0-9]+).*/\1/p' || true)"
          publisher="$GITHUB_WORKSPACE/diagnostic/scripts/diagnostics/managed_start_diagnostic.py"
          if [[ -f "$publisher" ]]; then
            if ! python "$publisher" --publish --diagnostics "$diagnostics" --output "$publish" --identity "shipping=$(git_id shipping)" --identity "diagnostic=$(git_id diagnostic)" --identity "workflow=$(sha diagnostic/.github/workflows/managed-start-diagnostic.yml)" --identity "script=$(sha diagnostic/scripts/diagnostics/managed_start_diagnostic.py)" --identity "tests=$(sha diagnostic/tests/diagnostics/test_managed_start_diagnostic.py)" --identity "package=$(sha "$package_tmp/happyranch-linux-amd64.tar")" --identity "run_id=${GITHUB_RUN_ID:-}" --identity "run_attempt=${GITHUB_RUN_ATTEMPT:-}" --identity "runner_image=${ImageOS:-}" --identity "image_version=${ImageVersion:-}" --identity "systemd=$systemd" 2>/dev/null; then printf '%s\n' 'diagnostic_publication_failed' >&2; exit 3; fi
          else
            python - "$publish" "$(git_id shipping)" "$(git_id diagnostic)" "$(sha diagnostic/.github/workflows/managed-start-diagnostic.yml)" "$(sha diagnostic/scripts/diagnostics/managed_start_diagnostic.py)" "$(sha diagnostic/tests/diagnostics/test_managed_start_diagnostic.py)" "$(sha "$package_tmp/happyranch-linux-amd64.tar")" "${GITHUB_RUN_ID:-}" "${GITHUB_RUN_ATTEMPT:-}" "${ImageOS:-}" "${ImageVersion:-}" "$systemd" "$diagnostics" 2>/dev/null <<'PY' || { printf '%s\n' 'diagnostic_publication_failed' >&2; exit 3; }
          import json, pathlib, re, sys
          output = pathlib.Path(sys.argv[1]); diagnostics = pathlib.Path(sys.argv[13]); cap = 4096; failed = False
          names = ("shipping", "diagnostic", "workflow", "script", "tests", "package", "run_id", "run_attempt", "runner_image", "image_version", "systemd")
          patterns = (r"[0-9a-f]{40}", r"[0-9a-f]{40}", r"[0-9a-f]{64}", r"[0-9a-f]{64}", r"[0-9a-f]{64}", r"[0-9a-f]{64}", r"[0-9]{1,20}", r"[0-9]{1,4}", r"ubuntu24|ubuntu-24\.04", r"[0-9]{8}\.[0-9]+\.[0-9]+", r"255")
          values = {key: value if len(value) <= cap and re.fullmatch(pattern, value) else "unavailable" for key, value, pattern in zip(names, sys.argv[2:13], patterns)}
          try: output.mkdir(parents=True, exist_ok=True)
          except OSError: failed = True
          def write(name, value):
              global failed
              try: (output / name).write_text(value, encoding="ascii")
              except OSError: failed = True
          write("provenance.json", json.dumps({"schema": "managed-start-diagnostic-provenance-v1", **values}, sort_keys=True) + "\n")
          def bounded(name):
              try:
                  with (diagnostics / name).open("rb") as stream: return stream.read(cap + 1)
              except FileNotFoundError: return None
              except OSError:
                  global failed
                  failed = True; return None
          receipt = bounded("receipt.txt")
          if receipt is not None:
              try:
                  if len(receipt) > cap: failed = True; receipt = None
              except TypeError: failed = True; receipt = None
          if receipt is not None:
              try:
                  lines = receipt.decode("ascii", "strict").splitlines(); fields = dict(line.split("=", 1) for line in lines if line.count("=") == 1)
                  valid = len(fields) == len(lines) and set(fields) <= {"schema", "run_id", "run_attempt", "build_status", "harness_status"} and fields.get("schema") == "managed-start-diagnostic-receipt-v1" and ("run_id" not in fields or re.fullmatch(r"[0-9]{1,20}", fields["run_id"])) and ("run_attempt" not in fields or re.fullmatch(r"[0-9]{1,4}", fields["run_attempt"])) and all(key not in fields or re.fullmatch(r"[0-9]{1,3}", fields[key]) and 0 <= int(fields[key]) <= 255 for key in ("build_status", "harness_status"))
                  if valid: write("receipt.txt", "".join(f"{key}={fields[key]}\n" for key in sorted(fields)))
              except UnicodeError: failed = True
              except ValueError: pass
          cleanup = bounded("diagnostic-cleanup.json")
          if cleanup is not None:
              try:
                  if len(cleanup) > cap: failed = True; cleanup = None
              except TypeError: failed = True; cleanup = None
          if cleanup is not None:
              try:
                  value = json.loads(cleanup.decode("utf-8", "strict"))
                  if value in ({"cleanup": "complete"}, {"cleanup": "failed"}): write("diagnostic-cleanup.json", json.dumps(value, sort_keys=True) + "\n")
              except UnicodeError: failed = True
              except ValueError: pass
          if failed: raise SystemExit(3)
          PY
          fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: managed-start-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PUBLISH || format('{0}/managed-start-publish', runner.temp) }}
          if-no-files-found: warn
