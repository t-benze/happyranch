name: Managed M3 same-boot recovery

# THR-327 M3: manual same-boot acceptance; required CI stays lint/static.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed-m3:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set temporary paths
        run: |
          mkdir -p "$RUNNER_TEMP/managed-m3-logs"
          {
            echo "M2_BUILD=$RUNNER_TEMP/managed-m3-build"
            echo "M2_LOGS=$RUNNER_TEMP/managed-m3-logs"
            echo "MANAGED_DOWNLOADS=$RUNNER_TEMP/managed-downloads"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/linux/tsnet-sidecar/go.mod
          cache-dependency-path: app/linux/tsnet-sidecar/go.sum
      - name: Cache pinned Headscale binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MANAGED_DOWNLOADS }}/headscale
          key: managed-linux-amd64-headscale-0.25.1-d2cda0a5d748587f77c920a76cd1bf1ab429e5299ba5bc6b3dda90712721b45b
      - name: Cache pinned Tailscale archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MANAGED_DOWNLOADS }}/tailscale.tgz
          key: managed-linux-amd64-tailscale-1.102.3-36ddd9b51be57ffc2990cf76323cfa13643bfbb1b8a969f6183fa164741cdef5
      - name: Install system Python venv support
        run: sudo apt-get update && sudo apt-get install -y python3-venv
      - name: Install, exercise seven same-boot recovery steps, uninstall and check residue
        run: |
          set -euo pipefail
          mkdir -p "$M2_LOGS"
          bash scripts/ci/m3_recovery.sh run 2>&1 | tee "$M2_LOGS/run.log"
      - name: Dump plain diagnostics before teardown
        if: always()
        run: bash scripts/ci/m3_recovery.sh logs
      - name: Stop disposable fixtures and discard input keys
        if: always()
        run: bash scripts/ci/m3_recovery.sh teardown 2>&1 | tee "$M2_LOGS/teardown.log"
      - name: Upload plain logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: managed-m3-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.M2_LOGS }}
          if-no-files-found: error
          retention-days: 14
