name: Nightly integration

on:
  schedule:
    # 07:00 UTC nightly — off-peak. Adjust the cron if you prefer another window.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ci-all:
    name: Manual local CI all (Python 3.14, Node 24)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install zsh (real-zsh cleanup regression)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Run exact local CI all in a clean test environment
        run: |
          uv run python - <<'PY'
          import hashlib, json, os, pathlib, shutil, signal, subprocess, sys, tempfile, time

          source = pathlib.Path.cwd()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert head == os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git', 'status', '--porcelain'])
          assert sys.version_info[:2] == (3, 14)
          evidence = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-ci-all'
          evidence.mkdir()
          receipt = {'event': os.environ['GITHUB_EVENT_NAME'], 'ref': os.environ['GITHUB_REF'],
                     'github_sha': os.environ['GITHUB_SHA'], 'checkout': head,
                     'command': 'scripts/local_ci.sh all', 'python': sys.executable,
                     'python_version': sys.version, 'source_sha256': {
                         name: hashlib.sha256((source / name).read_bytes()).hexdigest()
                         for name in ('scripts/local_ci.sh', 'tests/helpers/integration_parent.py',
                                      'tests/helpers/integration_stub_guard/guard.py', 'cli/main.py',
                                      'uv.lock', 'pyproject.toml', 'tests/conftest.py',
                                      'tests/daemon/conftest.py', 'tests/daemon/test_routes_dashboard.py',
                                      '.github/workflows/nightly-integration.yml')}}
          with tempfile.TemporaryDirectory(prefix='local-ci-parent-') as directory:
              root = pathlib.Path(directory)
              for name in ('home', 'config', 'cache', 'tmp', 'daemon', 'bin'):
                  (root / name).mkdir(mode=0o700)
              (root / 'daemon/executors.json').write_text('{}')
              for tool in ('uv', 'node', 'npm', 'npx'):
                  resolved = shutil.which(tool)
                  assert resolved is not None, tool
                  (root / 'bin' / tool).symlink_to(pathlib.Path(resolved).resolve())
              env = {'HOME': str(root / 'home'), 'XDG_CONFIG_HOME': str(root / 'config'),
                     'XDG_CACHE_HOME': str(root / 'cache'), 'TMPDIR': str(root / 'tmp'),
                     'TMP': str(root / 'tmp'), 'TEMP': str(root / 'tmp'),
                     'HAPPYRANCH_DAEMON_HOME': str(root / 'daemon'), 'HAPPYRANCH_DAEMON_PORT': '0',
                     'PATH': os.pathsep.join((str(root / 'bin'), str(source / '.venv/bin'), '/usr/local/bin', '/usr/bin', '/bin')),
                     'UV_PYTHON': sys.executable, 'UV_PYTHON_DOWNLOADS': 'never',
                     'UV_CACHE_DIR': str(root / 'cache/uv'), 'PYTHONNOUSERSITE': '1',
                     'LANG': 'C.UTF-8', 'LC_ALL': 'C.UTF-8', 'CI': 'true'}
              receipt['tools'] = {tool: {'path': str((root / 'bin' / tool).resolve()),
                                        'version': subprocess.check_output([tool, '--version'], env=env, text=True).strip()}
                                  for tool in ('uv', 'node', 'npm')}
              assert receipt['tools']['node']['version'].split('.')[0] == 'v24'
              focused_nodes = [
                  'tests/daemon/test_routes_dashboard.py::' + name for name in (
                      'test_delayed_start_preserves_both_cleanup_timeout_details',
                      'test_startup_failure_without_worker_releases_and_reaps_context',
                      'test_shutdown_handshake_timeout_releases_and_reaps_owned_context',
                      'test_lifespan_async_warm_serves_503_and_clean_shutdown',
                      'test_forced_watchdog_regression_cleanup_ownership',
                      'test_cleanup_incomplete_is_hard_failure_and_outer_owner_reaps')]
              candidate_python = source / '.venv/bin/python'
              assert candidate_python.samefile(sys.executable)
              unit_pause_reason = 'Founder THR-291 seq5/16: Python units SUSPENDED until a new verdict'
              receipt['python_unit_status'] = 'suspended'
              receipt['python_unit_reason'] = unit_pause_reason
              receipt['focused'] = [
                  {'command': [str(candidate_python), '-m', 'pytest', *focused_nodes, '-v', '-n', str(workers)],
                   'timeout_seconds': 300, 'status': 'suspended',
                   'reason': unit_pause_reason} for workers in (0, 4)]
              receipt['all_status'] = 'not_run'
              receipt_path = evidence / 'provenance.json'
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
              print(json.dumps(receipt, sort_keys=True), flush=True)
              print('SKIPPED: focused Python prerequisites SUSPENDED; no unit tests executed', flush=True)
              # Fixed pause; restore this block and provenance only after founder release and review.
              if False:
                  for index, focused in enumerate(receipt['focused']):
                      label = 'focused-serial' if index == 0 else 'focused-parallel'
                      stdout_path = evidence / (label + '.stdout.log')
                      stderr_path = evidence / (label + '.stderr.log')
                      started = time.monotonic()
                      focused['status'] = 'running'
                      receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
                      print(json.dumps(focused, sort_keys=True), flush=True)
                      with stdout_path.open('wb') as stdout, stderr_path.open('wb') as stderr:
                          process = subprocess.Popen(focused['command'], env=env, stdout=stdout,
                                                     stderr=stderr, start_new_session=True)
                          try:
                              exit_code = process.wait(timeout=focused['timeout_seconds'])
                              focused['timed_out'] = False
                          except subprocess.TimeoutExpired:
                              os.killpg(process.pid, signal.SIGKILL)
                              process.wait()
                              exit_code = 124
                              focused['timed_out'] = True
                      focused.update(status='success' if exit_code == 0 else 'failure',
                                     exit_code=exit_code, elapsed_seconds=time.monotonic() - started)
                      full_log = evidence / (label + '.log')
                      with full_log.open('wb') as combined:
                          for path, stream in ((stdout_path, sys.stdout.buffer), (stderr_path, sys.stderr.buffer)):
                              with path.open('rb') as output:
                                  shutil.copyfileobj(output, combined)
                              with path.open('rb') as output:
                                  shutil.copyfileobj(output, stream)
                              stream.flush()
                      focused['logs'] = {path.name: {'size_bytes': path.stat().st_size,
                                                   'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                                         for path in (stdout_path, stderr_path, full_log)}
                      receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
                      print(json.dumps(focused, sort_keys=True), flush=True)
                      if exit_code != 0:
                          print('focused prerequisite failed; scripts/local_ci.sh all NOT RUN', flush=True)
                          raise SystemExit(exit_code)
              receipt['all_status'] = 'running'
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
              result = subprocess.run([sys.executable, 'scripts/run_bounded_output.py',
                                       '--output', str(evidence / 'local-ci-all.log'),
                                       '--max-bytes', '1048576', '--', 'scripts/local_ci.sh', 'all'], env=env)
              receipt['exit_code'] = result.returncode
              receipt['all_status'] = 'success' if result.returncode == 0 else 'failure'
              receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
              print('scripts/local_ci.sh all exit_code=' + str(result.returncode), flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Upload manual local CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-ci-all-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-ci-all/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Python integration (3.12)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Integration tests spawn a real daemon + fake CLIs; cap the job so a hung
    # daemon can't run for the full 6h default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: '3.12'
      - name: Sync dependencies (frozen)
        run: uv sync --frozen
      - name: Run integration tests
        run: |
          mkdir -p artifacts
          python3 scripts/run_bounded_output.py \
            --output artifacts/nightly-integration.log \
            --max-bytes 1048576 \
            -- uv run python tests/helpers/integration_parent.py -- pytest tests/ -v -m integration \
              --junitxml=artifacts/nightly-integration.xml
      - name: Build integration summary
        if: ${{ always() }}
        env:
          NIGHTLY_ARTIFACT_NAME: nightly-integration-${{ github.run_id }}-${{ github.run_attempt }}
          NIGHTLY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/nightly_integration_summary.py \
            artifacts/nightly-integration.xml \
            --output artifacts/nightly-summary.md \
            --head-sha "${GITHUB_SHA}" \
            --run-url "${NIGHTLY_RUN_URL}" \
            --artifact-name "${NIGHTLY_ARTIFACT_NAME}"
          cat artifacts/nightly-summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload nightly evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/nightly-integration.xml
            artifacts/nightly-integration.log
            artifacts/nightly-summary.md
          if-no-files-found: warn
          retention-days: 14

  report-scheduled-failure:
    name: Report scheduled integration failure
    needs: integration
    if: ${{ always() && github.event_name == 'schedule' && needs.integration.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Download nightly evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Open or update nightly failure issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'nightly-integration-failure';
            const title = 'Nightly integration scheduled failure';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const summaryPath = 'artifacts/nightly-summary.md';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8')
              : 'Nightly summary artifact was unavailable; inspect the hosted run logs.';
            const body = `Scheduled run [${context.runId}](${runUrl}) failed at \`${context.sha}\`.\n\n${summary}`;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: 'b60205',
                description: 'Automated failures from the scheduled integration suite',
              });
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const matches = openIssues.filter(
              issue => !issue.pull_request && issue.title === title,
            );
            if (matches.length > 1) {
              core.setFailed(`Refusing ambiguous nightly issue set: found ${matches.length}`);
              return;
            }
            if (matches.length === 1) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: matches[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
