[project]
name = "happyranch"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "httpx>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.29",
    "python-dateutil>=2.9",
]

[project.scripts]
happyranch = "cli.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.21.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
tmp_path_retention_policy = "failed"
# No default unit lane. tests/conftest.py requires explicit platform files
# or -m integration through the isolated parent, before collection.
addopts = ""
markers = [
    "integration: end-to-end tests that spawn a real daemon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime", "cli"]
# Include ordinary bundled skills once through the explicit data inventory.
exclude = ["runtime/skills/bundled/**"]

[tool.hatch.build.targets.wheel.force-include]
"runtime/skills/bundled" = "runtime/skills/bundled"
